name: Deploy to Cloudflare

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: rapid gh-pages pushes queue instead of racing, and an in-flight
# production upload is never cancelled.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
