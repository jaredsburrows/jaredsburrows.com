name: build

on:
  push:
    branches:
      - gh-pages
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize ]

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch (saves runner minutes on rapid pushes, e.g.
# Renovate, and gives faster feedback on the latest commit); let master runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/gh-pages' }}

env:
  JAVA_VERSION: 25

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Nu HTML Checker
        run: npm install --no-save vnu-jar

      - name: Validate HTML
        run: java -jar node_modules/vnu-jar/build/dist/vnu.jar index.html 404.html */index.html

      - name: Check JavaScript syntax
        run: for f in static/js/*.js; do node --check "$f"; done

      - name: Validate talks data
        run: node .github/validate-talks.js

      - name: Validate site invariants
        run: node .github/validate-site.js

      # Credential-less config/asset validation: proves `wrangler deploy` would succeed
      # without ever exposing the Cloudflare token to PR-triggered runs.
      - name: Validate Cloudflare config (dry run)
        run: npx --yes wrangler deploy --dry-run
