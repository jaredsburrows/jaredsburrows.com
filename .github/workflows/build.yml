name: build

on:
  push:
    branches:
      - gh-pages
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize ]
  # Manual escape hatch. The checks run first here too, so a dispatched deploy
  # is gated exactly like a pushed one; only the trigger differs.
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch (saves runner minutes on rapid pushes, e.g.
# Renovate, and gives faster feedback on the latest commit); let master runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/gh-pages' }}

env:
  JAVA_VERSION: 25

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Nu HTML Checker
        run: npm install --no-save vnu-jar

      # Every tracked .html, resolved at run time. A literal list silently stops
      # covering pages that are added later, and vnu exits 0 on a path that
      # matches nothing — so a stale list reads green while checking nothing.
      - name: Validate HTML
        run: git ls-files '*.html' | xargs java -jar node_modules/vnu-jar/build/dist/vnu.jar

      - name: Check JavaScript syntax
        run: for f in static/js/*.js; do node --check "$f"; done

      - name: Validate talks data
        run: node .github/validate-talks.js

      - name: Validate site invariants
        run: node .github/validate-site.js

      - name: Test site invariant validator
        run: node .github/validate-site.test.js

      # The Worker decides whether / is HTML or Markdown, and getting that wrong
      # in the browser direction would serve a page with no HTML in it to every
      # visitor and to Googlebot. No deploy can tell you that; this truth table can.
      - name: Test the Worker
        run: node --test src/worker.test.mjs

      # Credential-less config/asset validation: proves `wrangler deploy` would succeed
      # without ever exposing the Cloudflare token to PR-triggered runs.
      - name: Validate Cloudflare config (dry run)
        run: npx --yes wrangler deploy --dry-run

  # Lives here, rather than in its own workflow, so `needs` can gate it. As a
  # separate workflow triggered on push it raced the checks instead of waiting
  # for them, and nothing stopped a red commit from reaching production.
  deploy:
    name: Deploy to Cloudflare
    needs: checks
    # Never from a pull_request event: a PR must not reach production, and the
    # Cloudflare token is not exposed to PR-triggered runs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Serialize deploys: rapid gh-pages pushes queue instead of racing, and an
    # in-flight production upload is never cancelled. Job-level, so it holds
    # across runs without serializing the checks job too.
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
