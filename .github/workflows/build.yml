name: build

on:
  push:
    branches:
      - gh-pages
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize ]

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch (saves runner minutes on rapid pushes, e.g.
# Renovate, and gives faster feedback on the latest commit); let master runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/gh-pages' }}

env:
  JAVA_VERSION: 25

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v7.0.0

      - name: Configure JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Nu HTML Checker
        run: npm install --no-save vnu-jar

      - name: Validate HTML
        run: java -jar node_modules/vnu-jar/build/dist/vnu.jar index.html

      - name: Check JavaScript syntax
        run: for f in static/js/*.js; do node --check "$f"; done
